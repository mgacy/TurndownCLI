name: CI

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Security audit
        run: bun pm audit

      - name: Type check
        run: bun run prebuild && bunx tsc --noEmit

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-output
          path: dist/
